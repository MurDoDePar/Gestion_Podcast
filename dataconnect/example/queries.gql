query FindUserByGoogleId($googleId: String!) @auth(level: USER) {
  users(where: { googleId: { eq: $googleId } }, limit: 1) {
    id
    googleId
    displayName
    email
  }
}

query GetMySubscriptions($userId: UUID!) @auth(level: USER) {
  subscriptionTypes(where: { userId: { eq: $userId } }) {
    user @redact {
      googleId
    }
    listOrder
    podcast {
      id
      title
      feedUrl
      imageUrl
      author
      categories
    }
  }
}

query GetRecommendations($feedUrl: String!) @auth(level: PUBLIC, insecureReason: "Recommendations are public anonymous data") {
  subscriptionTypes(where: { podcast: { feedUrl: { eq: $feedUrl } } }) {
    user {
      subscriptionTypes_on_user {
        podcast {
          id
          title
          imageUrl
          feedUrl
          author
          categories
        }
      }
    }
  }
}

query GetPodcastByFeedUrl($feedUrl: String!) @auth(level: PUBLIC, insecureReason: "Podcasts are public data") {
  podcasts(where: { feedUrl: { eq: $feedUrl } }, limit: 1) {
    id
    title
    feedUrl
    imageUrl
  }
}

query GetAffinityRecommendations($userId: UUID!) @auth(level: USER) {
  mySubscriptions: subscriptionTypes(where: { userId: { eq: $userId } }) {
    podcast {
      id
      feedUrl
      title
      subscriptionTypes_on_podcast(where: { userId: { ne: $userId } }) {
        user {
          id
          displayName
          subscriptionTypes_on_user {
            podcast {
              id
              title
              feedUrl
              imageUrl
              author
              categories
            }
          }
        }
      }
    }
  }
}

# Requête de récupération du Delta de synchronisation avec heure de référence serveur
query GetPodcastHistoryDelta($userId: UUID!, $since: Timestamp!) @auth(expr: "auth != null") {
  # 1. Vérification d'autorisation
  user(id: $userId) {
    googleId @check(expr: "this == auth.uid", message: "Unauthorized")
  }
  
  # 2. Récupération des données modifiées depuis la dernière synchro
  delta: _select(
    sql: """
      SELECT 
        episode_id AS "episodeId", 
        is_read AS "isRead", 
        read_at AS "readAt", 
        status, 
        deleted_at AS "deletedAt", 
        updated_at AS "updatedAt"
      FROM episode_status
      WHERE user_id = $1 AND updated_at > $2;
    """,
    params: [$userId, $since]
  )
  
  # 3. Récupération du temps serveur actuel de référence
  serverTime: _selectFirst(
    sql: "SELECT NOW() as \"time\""
  )
}

