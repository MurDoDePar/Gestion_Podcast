mutation InsertUser($googleId: String!, $displayName: String!, $email: String, $photoUrl: String, $createdAt: Timestamp!) @auth(expr: "auth != null && vars.googleId == auth.uid") {
  user_insert(data: {
    googleId: $googleId,
    displayName: $displayName,
    email: $email,
    photoUrl: $photoUrl,
    createdAt: $createdAt
  })
}

mutation UpsertUser($id: UUID!, $googleId: String!, $displayName: String!, $email: String, $photoUrl: String, $createdAt: Timestamp!) @auth(expr: "auth != null && vars.googleId == auth.uid") {
  user_upsert(data: {
    id: $id,
    googleId: $googleId,
    displayName: $displayName,
    email: $email,
    photoUrl: $photoUrl,
    createdAt: $createdAt
  })
}

mutation UpsertPodcast($id: UUID, $title: String!, $feedUrl: String!, $description: String, $imageUrl: String, $author: String, $categories: [String!], $createdAt: Timestamp!) @auth(expr: "auth != null", insecureReason: "Any authenticated user can add a podcast") {
  podcast_upsert(data: {
    id: $id,
    title: $title,
    feedUrl: $feedUrl,
    description: $description,
    imageUrl: $imageUrl,
    author: $author,
    categories: $categories,
    createdAt: $createdAt
  })
}

mutation SubscribeToPodcast($userId: UUID!, $podcastId: UUID!, $subscribedAt: Timestamp!, $listOrder: Int) @auth(expr: "auth != null") @transaction {
  query @redact {
    user(id: $userId) {
      googleId @check(expr: "this == auth.uid", message: "Unauthorized")
    }
  }
  subscriptionType_upsert(data: {
    userId: $userId,
    podcastId: $podcastId,
    subscribedAt: $subscribedAt,
    listOrder: $listOrder
  })
}

mutation UpdateSubscriptionOrder($userId: UUID!, $podcastId: UUID!, $listOrder: Int!) @auth(expr: "auth != null") @transaction {
  query @redact {
    user(id: $userId) {
      googleId @check(expr: "this == auth.uid", message: "Unauthorized")
    }
  }
  subscriptionType_update(key: { userId: $userId, podcastId: $podcastId }, data: { listOrder: $listOrder })
}

mutation UnsubscribeFromPodcast($userId: UUID!, $podcastId: UUID!) @auth(expr: "auth != null") @transaction {
  query @redact {
    user(id: $userId) {
      googleId @check(expr: "this == auth.uid", message: "Unauthorized")
    }
  }
  subscriptionType_delete(key: { userId: $userId, podcastId: $podcastId })
}

# Utilitaire pour nettoyer les doublons avant de déployer le schéma avec @unique
# Vous pouvez l'exécuter directement depuis l'extension VS Code (Run Local / Run Production)
mutation CleanupDuplicates @auth(expr: "auth != null") {
  cleanPodcasts: _execute(sql: """
    DELETE FROM "podcast"
    WHERE "id" NOT IN (
        SELECT MIN("id")
        FROM "podcast"
        GROUP BY "feed_url"
    )
  """)
  cleanUsers: _execute(sql: """
    DELETE FROM "user"
    WHERE "id" NOT IN (
        SELECT MIN("id")
        FROM "user"
        GROUP BY "email"
    )
  """)
}

# Mutation de synchronisation globale utilisant le SQL Natif PostgreSQL
mutation SyncPodcastHistory($userId: UUID!, $history: Any!) @auth(expr: "auth != null") @transaction {
  # 1. Vérification d'autorisation (seul le propriétaire peut synchroniser ses données)
  query @redact {
    user(id: $userId) {
      googleId @check(expr: "this == auth.uid", message: "Unauthorized: Access denied")
    }
  }
  
  # 2. Upsert conditionnel atomique
  sync: _execute(
    sql: """
      INSERT INTO "episode_status" (
        user_id, 
        episode_id, 
        is_read, 
        read_at, 
        status, 
        updated_at, 
        deleted_at
      )
      SELECT 
        $1, 
        r."episodeId", 
        r."isRead", 
        r."readAt", 
        r."status", 
        NOW(), 
        r."deletedAt"
      FROM jsonb_to_recordset($2::jsonb) AS r(
        "episodeId" VARCHAR,
        "isRead" BOOLEAN,
        "readAt" TIMESTAMP,
        "status" VARCHAR,
        "deletedAt" TIMESTAMP
      )
      ON CONFLICT (user_id, episode_id)
      DO UPDATE SET
        is_read = EXCLUDED.is_read,
        read_at = EXCLUDED.read_at,
        status = EXCLUDED.status,
        updated_at = NOW(),
        deleted_at = EXCLUDED.deleted_at
      WHERE EXCLUDED.read_at > episode_status.read_at;
    """,
    params: [$userId, $history]
  )
}


