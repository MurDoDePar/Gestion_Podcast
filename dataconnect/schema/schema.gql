type User @table {
  googleId: String!
  displayName: String!
  createdAt: Timestamp!
  email: String @unique
  photoUrl: String
}

type Podcast @table {
  title: String!
  feedUrl: String! @unique
  createdAt: Timestamp!
  description: String
  imageUrl: String
  author: String
  categories: [String]
}

type SubscriptionType @table(key: ["user", "podcast"]) {
  user: User!
  podcast: Podcast!
  subscribedAt: Timestamp!
  listOrder: Int
}

type EpisodeStatus @table(key: ["user", "episodeId"]) {
  user: User!
  episodeId: String!
  isRead: Boolean!
  readAt: Timestamp!
  status: String!
  updatedAt: Timestamp! @default(expr: "request.time")
  deletedAt: Timestamp
}


