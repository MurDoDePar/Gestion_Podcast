type User @table {
  googleId: String!
  displayName: String!
  createdAt: Timestamp!
  email: String @unique
  photoUrl: String
}

type Podcast @table {
  title: String!
  feedUrl: String! @unique
  createdAt: Timestamp!
  description: String
  imageUrl: String
  author: String
  categories: [String]
}

type SubscriptionType @table(key: ["user", "podcast"]) {
  user: User!
  podcast: Podcast!
  subscribedAt: Timestamp!
  listOrder: Int
}
